<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Igor Josipović</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">

<body>

<header class="nav">
  <div class="container">
    <a class="back" id="back-link" href="index.html#projects">← All projects</a>
    <a class="brand" href="index.html">Igor Josipović</a>

<main id="content" class="container">
  <!-- filled by script -->
</main>

<footer class="footer">
  <div class="container">© 2026 Igor Josipović · Belgrade, Serbia</div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot preview">
  <button type="button" class="lightbox-close" id="lightbox-close">Close · Esc</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  // All project data lives here. "images" is a list: add as many files as you like
  // and the gallery draws them in order.
  const projects = [
    {
      id: 1,
      title: "Hypraenergy — E-Commerce Platform",
      year: "2026",
      description: "Interactive web shop with a full checkout workflow and a custom-built CMS. Added smooth page transitions and animated counters to lift the front-end experience above a standard storefront.",
      tags: ["PHP", "MySQL", "Custom CMS", "Checkout Flow"],
      images: [
        "projektislike/Screenshot_20260716_211831.png",
        "projektislike/Screenshot_20260716_211729.png",
        "projektislike/Screenshot_20260716_211846.png",
        "projektislike/Screenshot_20260716_211913.png",
        "projektislike/Screenshot_20260716_211933.png",
        "projektislike/Screenshot_20260716_120522.png",
        "projektislike/Screenshot_20260716_120538.png"
      ]
    },
    {
      id: 2,
      title: "PCFoto — Price Intelligence System",
      year: "2026",
      description: "Scraping engine that pulls product data from multiple competitor sources and matches it against PCFoto's own catalog in the database. Gives the company a live read on whether competitors are undercutting a price, so they know exactly when to adjust.",
      tags: ["Web Scraping", "Price Matching", "MySQL"],
      images: [
        "projektislike/Screenshot_20260716_214712.png"
      ]
    },
    {
      id: 3,
      title: "Social Enterprises Platform — NALED",
      year: "2026",
      description: "Registration platform with multi-criteria filtering and a centralized search engine that sorts results into blogs, news, and business profiles in real time. Paired with an internal CMS for full layout and content control.",
      tags: ["PHP", "Search Engine", "Custom CMS"],
      images: [
        "projektislike/Screenshot_20260716_212334.png",
        "projektislike/Screenshot_20260716_120325.png",
        "projektislike/Screenshot_20260716_120333.png",
        "projektislike/Screenshot_20260716_120344.png"
      ]
    },
    {
      id: 4,
      title: "Nice-HR — NALED",
      year: "2025",
      description: "Extension of an existing NALED Laravel system, focused on API synchronization with the organization's timesheet platform, keeping employees, engagements, and projects consistent across both systems. Also built out the notification system, including database-tracked delivery and read/seen status.",
      tags: ["Laravel", "API Sync", "Notifications"],
      images: [
        "projektislike/Screenshot_20260716_214155.png"
      ]
    },
    {
      id: 5,
      title: "Enterprise E-Commerce & Hosting — Akton",
      year: "2025",
      description: "Hosting/domain e-commerce system integrated with WHMCS for automated provisioning. Built real-time WHOIS checks, secure card payments, and dynamic NBS payment-slip generation, alongside a custom CMS and blog.",
      tags: ["WHMCS API", "Payment Gateway", "WHOIS Integration"],
      images: [
        "projektislike/Screenshot_20260716_115821.png",
        "projektislike/Screenshot_20260716_115833.png",
        "projektislike/Screenshot_20260716_115853.png",
        "projektislike/Screenshot_20260716_212022.png",
        "projektislike/Screenshot_20260716_212210.png",
        "projektislike/Screenshot_20260716_212255.png"
      ]
    },
    {
      id: 6,
      title: "GPON Installation Scheduler — Telekom",
      year: "2024",
      description: "Object-oriented system built for Telekom to manage internet installation appointments: reservation scheduling, client records, and organizational tracking. Includes a visual calendar, linked object relationships, and complex multi-table data structures for managing installations at scale.",
      tags: ["OOP", "Visual Calendar", "Complex Data Modeling"],
      images: [
        "projektislike/Screenshot_20260716_120237.png",
        "projektislike/Screenshot_20260716_214556.png"
      ]
    },
    {
      id: 7,
      title: "Timesheet & Project Management System — NALED",
      year: "2024",
      description: "Resource-allocation system for a 100+ employee organization. Built an interactive matrix UI with real-time hour calculations, lumpsum entry modes, and high-performance API sync between two enterprise systems.",
      tags: ["PHP", "JavaScript", "MySQL", "API Sync"],
      images: [
        "projektislike/Screenshot_20260716_113315.png",
        "projektislike/Screenshot_20260716_113356.png",
        "projektislike/Screenshot_20260716_113432.png",
        "projektislike/Screenshot_20260716_115550.png",
        "projektislike/Screenshot_20260716_115645.png",
        "projektislike/Screenshot_20260716_115656.png",
        "projektislike/Screenshot_20260716_115708.png",
        "projektislike/Screenshot_20260716_115722.png",
        "projektislike/Screenshot_20260716_115801.png",
        "projektislike/Screenshot_20260716_115745.png"
      ]
    }
  ];

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(){
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'), 10);
    const index = projects.findIndex(p => p.id === id);
    const content = document.getElementById('content');

    if(index === -1){
      document.title = "Project not found — Igor Josipović";
      content.innerHTML = `
        <div class="notfound">
          <div class="eyebrow">404</div>
          <h1 style="font:600 28px/1.2 var(--display)">Project not found</h1>
          <p>Check that the link ends with a valid id, for example project.html?id=1.</p>
          <a class="btn btn-primary" href="index.html#projects">Back to projects</a>
        </div>`;
      return;
    }

    const p = projects[index];
    const prev = projects[(index + projects.length - 1) % projects.length];
    const next = projects[(index + 1) % projects.length];

    document.title = p.title + " — Igor Josipović";
    document.getElementById('back-link').href = 'index.html#project-' + p.id;

    const tagsHTML = p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('');

    const galleryHTML = p.images.map((src, i) => `
      <button type="button" class="shot shot-btn" data-src="${esc(src)}" data-alt="${esc(p.title)} — screenshot ${i + 1}">
        <span class="frame-bar"><i></i><i></i><i></i></span>
        <span class="shot-body"><img src="${esc(src)}" alt="${esc(p.title)} — screenshot ${i + 1}" loading="lazy" decoding="async" onerror="this.closest('.shot').classList.add('no-img')"></span>
      </button>`).join('');

    const othersHTML = projects.filter(o => o.id !== p.id).map(o => `
      <li><a href="project.html?id=${o.id}">
        <span class="year">${esc(o.year)}</span>
        <span class="name">${esc(o.title)}</span>
        <span class="go">View →</span>
      </a></li>`).join('');

    content.innerHTML = `
      <section class="pitch">
        <div class="pitch-copy">
          <div class="eyebrow">Project ${index + 1} / ${projects.length}</div>
          <h1>${esc(p.title)}</h1>
          <p class="pitch-desc">${esc(p.description)}</p>
        </div>
        <dl class="facts">
          <div><dt>Year</dt><dd>${esc(p.year)}</dd></div>
          <div><dt>Built with</dt><dd><div class="tags">${tagsHTML}</div></dd></div>
          <div><dt>Screenshots</dt><dd>${p.images.length} ${p.images.length === 1 ? 'image' : 'images'}</dd></div>
        </dl>
      </section>

      <section class="gallery-wrap">
        <div class="eyebrow">Screenshots</div>
        <div class="gallery" id="gallery">${galleryHTML}</div>
      </section>

      <nav class="pager" aria-label="Other projects">
        <a class="prev" href="project.html?id=${prev.id}"><small>← Previous</small><strong>${esc(prev.title)}</strong></a>
        <a class="next" href="project.html?id=${next.id}"><small>Next →</small><strong>${esc(next.title)}</strong></a>
      </nav>

      <section class="others">
        <h2>Other projects</h2>
        <ul>${othersHTML}</ul>
      </section>`;
  }

  render();

  // Lightbox: click a screenshot to view it full size. Close with the button,
  // a click on the dark background, or the Esc key.
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxClose = document.getElementById('lightbox-close');
  let lastFocus = null;

  function openLightbox(src, alt){
    lastFocus = document.activeElement;
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    lightboxClose.focus();
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    if(lastFocus){ lastFocus.focus(); }
  }

  const gallery = document.getElementById('gallery');
  if(gallery){
    gallery.addEventListener('click', (e) => {
      const btn = e.target.closest('.shot-btn');
      if(!btn || btn.classList.contains('no-img')) return;
      openLightbox(btn.dataset.src, btn.dataset.alt);
    });
  }

  lightbox.addEventListener('click', (e) => {
    if(e.target === lightbox){ closeLightbox(); }
  });
  lightboxClose.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && lightbox.classList.contains('open')){ closeLightbox(); }
  });
</script>

</body>
</html>
